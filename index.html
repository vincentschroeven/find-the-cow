<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Find the cow in a dark meadow before the song ends. A game for 05. It feels like Bubbles.">
<title>Find the Cow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL night field; HUD in the corners like a phone camera; overlays centered for start/end. Single dark look by choice. */
:root{
  --night:#04060a;
  --ink:#dfeaf0;
  --dim:rgba(223,234,240,.55);
  --faint:rgba(223,234,240,.18);
  --flash:#cdf3ff;
  --eye:#b8ffd9;
  --warn:#ff8a6b;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--mono);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
#grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.13;mix-blend-mode:screen;background-size:256px 256px;}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.75) 100%);}
#flashout{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .08s;}

.hud{position:fixed;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums;}
#hudTL{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px;}
#hudTR{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;}
#hudB{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px));transition:opacity 1.5s;}
.bar{width:150px;height:2px;background:var(--faint);}
.bar i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;}
.batt{width:30px;height:13px;border:1.5px solid var(--dim);border-radius:2px;padding:1.5px;position:relative;}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:var(--dim);}
.batt i{display:block;height:100%;background:var(--ink);transform-origin:left;}
.batt.low{border-color:var(--warn);} .batt.low i{background:var(--warn);}
#hint{opacity:.8}

.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,3,6,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;overflow-y:auto;}
.card{width:min(520px,100%);display:grid;gap:22px;}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);}
h1,h2{font-family:var(--display);font-style:normal;font-weight:300;line-height:.98;margin:0;text-wrap:balance;letter-spacing:-.035em;}
h1{font-size:clamp(44px,9vw,76px);}
h2{font-size:clamp(36px,7vw,56px);}
h1 em,h2 em{font-weight:500;color:var(--flash);font-style:normal;}
p{margin:0;line-height:1.6;color:var(--dim);font-size:13px;max-width:60ch;}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;color:var(--dim);}
.rules b{color:var(--ink);font-weight:500;}
.btn{justify-self:start;font:500 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#05080b;background:var(--flash);border:0;padding:15px 26px;border-radius:999px;cursor:pointer;box-shadow:0 0 40px rgba(205,243,255,.35);}
.btn:hover{background:#fff;}
#endOv.win{background:linear-gradient(to right,rgba(2,3,6,.85) 0%,rgba(2,3,6,.55) 30%,rgba(2,3,6,0) 55%);align-items:end;justify-items:start;}
#endOv.win .card{width:min(400px,100%);padding-left:clamp(0px,4vw,48px);}
#endOv{pointer-events:none;} #endOv .card{pointer-events:auto;}
#hudTC{top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;}
#clock{font-family:var(--display);font-size:clamp(26px,5vw,40px);font-weight:300;letter-spacing:.02em;color:var(--ink);text-transform:none;}
#clock.low{color:var(--warn);}
@media (max-width:700px){#endOv.win{background:linear-gradient(to bottom,rgba(2,3,6,0) 35%,rgba(2,3,6,.85) 65%);}}
.start{justify-items:center;text-align:center;gap:34px;}
.start h1{font-size:clamp(46px,11vw,104px);font-weight:300;}
.btn.play{justify-self:center;font-size:18px;letter-spacing:.32em;padding:20px 52px 20px 58px;}
.start .board{width:min(360px,100%);text-align:left;}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
a.btn{text-decoration:none;display:inline-block;}
.btn.ghost:hover{background:rgba(223,234,240,.1);}
.save{display:grid;gap:10px;}
.save input{font:500 15px/1 var(--mono);color:var(--ink);background:rgba(223,234,240,.06);border:1px solid var(--faint);border-radius:999px;padding:14px 20px;width:15ch;min-width:0;letter-spacing:.04em;}
.save input:focus-visible{outline:2px solid var(--flash);outline-offset:2px;}
.btn:disabled{opacity:.5;cursor:default;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--faint);box-shadow:none;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.big{font-family:var(--display);font-size:clamp(56px,12vw,96px);font-weight:300;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.big small{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.1em;margin-left:8px;}

.board{display:grid;gap:8px;border-top:1px solid var(--faint);padding-top:16px;}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;}
.board li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(223,234,240,.06);font-variant-numeric:tabular-nums;}
.board li .n{color:var(--dim);}
.board li .who{display:flex;align-items:center;gap:8px;min-width:0;}
.board li .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.board li img{width:20px;height:20px;border-radius:50%;flex:none;}
.board li.me .who span{color:var(--flash);}
.board li .t{color:var(--ink);}
.board .empty{font-size:12px;color:var(--dim);}

#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid var(--faint);border-radius:50%;pointer-events:none;display:none;}
#joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(223,234,240,.2);}
@media (prefers-reduced-motion: reduce){#grain{display:none}}
</style>
</head>
<body>


<canvas id="gl" aria-label="A meadow at night"></canvas>
<div id="grain"></div>
<div id="vig"></div>
<div id="flashout"></div>

<div class="hud" id="hudTL" hidden>
  <span>05 · It feels like Bubbles</span>
  <div class="bar"><i id="songbar"></i></div>
</div>
<div class="hud" id="hudTC" hidden><span id="clock">1:28</span></div>
<div class="hud" id="hudTR" hidden>
  <span id="pct">100%</span><div class="batt" id="batt"><i id="battfill"></i></div>
</div>
<div class="hud" id="hudB" hidden><span id="hint">WASD or arrows · mouse to look · shift to run</span></div>
<div id="joy"><i></i></div>

<section class="ov" id="startOv">
  <div class="card start">
    <h1>find the cow</h1>
    <button class="btn play" id="startBtn">PLAY</button>
    <div class="board" id="board1"></div>
  </div>
</section>

<section class="ov" id="pauseOv" hidden>
  <div class="card">
    <div class="eyebrow">Paused</div>
    <h2>The cow <em>waits.</em></h2>
    <div class="row"><button class="btn" id="resumeBtn">Resume</button><button class="btn ghost" id="quitBtn">Restart</button></div>
  </div>
</section>

<section class="ov" id="endOv" hidden>
  <div class="card">
    <div class="eyebrow" id="endEyebrow"></div>
    <h2 id="endTitle"></h2>
    <div class="big" id="endTime"></div>
    <p id="endText"></p>
    <form class="save" id="saveForm" hidden><label class="eyebrow" for="nameIn" id="saveMsg">Put your name on it.</label><div class="row"><input id="nameIn" maxlength="15" autocomplete="nickname" placeholder="Your name" spellcheck="false"><button class="btn" id="saveBtn" type="submit">SAVE</button></div></form>
    <div class="row"><button class="btn" id="againBtn">PLAY AGAIN</button><a class="btn ghost" id="albumBtn" href="https://open.spotify.com/album/0kKQTn7KT5Bqjs0mutVxDv?si=2d006645b2314beb" target="_blank" rel="noopener">CHECK FULL ALBUM</a></div>
    <div class="board" id="board2"></div>
  </div>
</section>

<audio id="song" src="song.mp3" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches;
const SONG_FALLBACK = 88.06;
const BEATS = [0.07, 0.743, 1.416, 2.067, 2.74, 3.413, 4.087, 4.737, 5.41, 6.084, 6.757, 7.407, 8.081, 8.754, 9.404, 10.077, 10.728, 11.424, 12.074, 12.748, 13.421, 14.071, 14.721, 15.418, 16.091, 16.742, 17.415, 18.088, 18.739, 19.412, 20.085, 20.759, 21.432, 22.082, 22.732, 23.429, 24.079, 24.752, 25.403, 26.076, 26.749, 27.423, 28.073, 28.746, 29.42, 30.093, 30.743, 31.417, 32.09, 32.763, 33.414, 34.087, 34.737, 35.41, 36.084, 36.757, 37.431, 38.081, 38.754, 39.404, 40.078, 40.751, 41.401, 42.075, 42.748, 43.421, 44.095, 44.815, 45.418, 46.068, 46.742, 47.415, 48.089, 48.739, 49.412, 50.085, 50.759, 51.409, 52.082, 52.756, 53.406, 54.079, 54.753, 55.426, 56.076, 56.75, 57.4, 58.073, 58.746, 59.42, 60.14, 60.743, 61.417, 62.09, 62.74, 63.414, 64.087, 64.76, 65.411, 66.084, 66.757, 67.408, 68.081, 68.754, 69.428, 70.078, 70.751, 71.425, 72.075, 72.748, 73.421, 74.072, 74.745, 75.418, 76.092, 76.765, 77.415, 78.089, 78.739, 79.412, 80.086, 80.689, 81.363, 82.083];
const IBI = 0.6734;
function sinceBeat(t) { if (t < BEATS[0]) return 9; let lo = 0, hi = BEATS.length - 1; if (t >= BEATS[hi]) return (t - BEATS[hi]) % IBI; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; } return t - BEATS[lo]; }
const FIELD = 100;              // half size of the meadow, metres
const WALK = 7.5, RUN = 14.0;
const song = $('song');
if (isTouch) { $('hint').textContent = 'Drag left to walk · drag right to look'; }

/* ---------- grain ---------- */
const grainFrames = [];
for (let f = 0; f < 4; f++) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = v * .9; d.data[i+1] = v; d.data[i+2] = v; d.data[i+3] = 255; }
  g.putImageData(d, 0, 0); grainFrames.push('url(' + c.toDataURL() + ')');
}
let gf = 0; setInterval(() => { $('grain').style.backgroundImage = grainFrames[gf++ % 4]; $('grain').style.transform = `translate(${Math.random()*40-20}px,${Math.random()*40-20}px)`; }, 70);

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020306);
scene.fog = new THREE.FogExp2(0x020307, 0.075);
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- sky ---------- */
const skyGeo = new THREE.SphereGeometry(400, 24, 12);
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'varying vec3 p; void main(){ float h = clamp(p.y,0.0,1.0); vec3 c = mix(vec3(0.030,0.045,0.075), vec3(0.004,0.006,0.012), pow(h,0.45)); gl_FragColor = vec4(c,1.0); }' });
const sky = new THREE.Mesh(skyGeo, skyMat); scene.add(sky);
{ const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const th = rnd() * Math.PI * 2, ph = Math.acos(1 - rnd() * 0.85); pos.set([Math.sin(ph)*Math.cos(th)*380, Math.cos(ph)*380, Math.sin(ph)*Math.sin(th)*380], i*3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fb4d8, size: 1.1, sizeAttenuation: false, fog: false, transparent: true, opacity: .7 }));
  sky.add(stars); }
// distant hills + tree line silhouette
{ const segs = 180, verts = [], R = 300;
  for (let i = 0; i <= segs; i++) { const a = i / segs * Math.PI * 2;
    const h = 6 + Math.sin(a*3.1)*5 + Math.sin(a*7.3+1)*3 + Math.max(0, Math.sin(a*19.0))*4 + (rnd()*2);
    verts.push(Math.cos(a)*R, -2, Math.sin(a)*R, Math.cos(a)*R, h, Math.sin(a)*R); }
  const idx = []; for (let i = 0; i < segs; i++) { const k = i*2; idx.push(k, k+1, k+2, k+1, k+3, k+2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)); g.setIndex(idx);
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x010203, fog: false, side: THREE.DoubleSide }))); }
// a few far farm lights for orientation
[[0.3, 0xffc27a], [2.1, 0xffd9a0], [3.9, 0xffb46a], [5.2, 0xd8e6ff]].forEach(([a, col]) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: col, fog: false, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.position.set(Math.cos(a)*290, 3 + rnd()*3, Math.sin(a)*290); s.scale.setScalar(5); scene.add(s); });

function glowTex() {
  if (glowTex.t) return glowTex.t;
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.18, 'rgba(255,255,255,.85)'); r.addColorStop(.45, 'rgba(255,255,255,.18)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return (glowTex.t = new THREE.CanvasTexture(c));
}

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0x1a2a44, 0x050805, 0.18); scene.add(hemi);
const hemiSkyN = new THREE.Color(0x1a2a44), hemiSkyL = new THREE.Color(0xc9d6e6), hemiGrN = new THREE.Color(0x050805), hemiGrL = new THREE.Color(0x3a4a30);
const flash = new THREE.SpotLight(0xd6f4ff, 5.2, 34, 0.62, 0.55, 1.35);
flash.position.set(0.12, -0.12, 0);
camera.add(flash);
const flashTarget = new THREE.Object3D(); scene.add(flashTarget); flash.target = flashTarget;
const fill = new THREE.PointLight(0xbfe9ff, 0.55, 5, 2); camera.add(fill);

/* ---------- ground: short grazed pasture, texture only ---------- */
{ const N = 1024, c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d');
  g.fillStyle = '#45543b'; g.fillRect(0, 0, N, N);
  // soft tonal variation (wrapped so it tiles)
  for (let i = 0; i < 700; i++) { const x = rnd()*N, y = rnd()*N, r = 20 + rnd()*90, v = rnd();
    const col = v < .45 ? '28,36,24' : v < .8 ? '105,120,90' : '88,80,58';
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { const gr = g.createRadialGradient(x+ox, y+oy, 0, x+ox, y+oy, r);
      gr.addColorStop(0, `rgba(${col},.22)`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x+ox-r, y+oy-r, r*2, r*2); } }
  // dense short grass strokes, mostly upright in screen space, lighter tips
  for (let i = 0; i < 160000; i++) { const x = rnd()*N, y = rnd()*N, v = rnd(), l = 1.5 + rnd()*5, a = rnd()*Math.PI*2;
    g.strokeStyle = v < .38 ? `rgba(140,160,120,${.25+rnd()*.35})` : v < .7 ? `rgba(22,30,20,${.35+rnd()*.4})` : v < .9 ? `rgba(185,192,160,${.18+rnd()*.3})` : `rgba(95,82,58,${.3+rnd()*.3})`;
    g.lineWidth = .7 + rnd()*1.1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke(); }
  // little dark gaps of soil and pale dry stalks lying flat
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(18,16,12,${.3+rnd()*.4})`; g.beginPath(); g.ellipse(rnd()*N, rnd()*N, 1+rnd()*3, 1+rnd()*2, rnd()*3, 0, 7); g.fill(); }
  for (let i = 0; i < 900; i++) { const x = rnd()*N, y = rnd()*N, a = rnd()*7, l = 6 + rnd()*14; g.strokeStyle = `rgba(210,205,170,${.25+rnd()*.3})`; g.lineWidth = .8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(100, 100); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground); }

/* ---------- grass tiles (follow the player) ---------- */
function bladeGeo(w, segs, curve) {
  const g = new THREE.PlaneGeometry(w, 1, 1, segs); g.translate(0, .5, 0);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) * (1 - y * .92)); p.setZ(i, y * y * curve); const v = .28 + y * .72; col.push(v, v, v); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals(); return g;
}
const TILE = 16;
const grassMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
// gentle wind
grassMat.onBeforeCompile = sh => { sh.uniforms.uTime = windU; sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
  `#include <begin_vertex>
   vec4 wp = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
   float sway = sin(uTime*1.3 + wp.x*0.35 + wp.z*0.22) * 0.02 + sin(uTime*2.7 + wp.z*0.9)*0.006;
   transformed.x += sway * position.y * position.y;`); };
const windU = { value: 0 };
const densShort = isTouch ? 9000 : 22000, densTall = isTouch ? 160 : 320;
const shortGeo = bladeGeo(0.018, 2, 0.06), tallGeo = bladeGeo(0.012, 5, 0.22);
function fillTile(mesh, n, hMin, hMax, palette, tufts) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  const centers = tufts ? Array.from({ length: tufts }, () => [(rnd() - .5) * TILE, (rnd() - .5) * TILE]) : null;
  for (let i = 0; i < n; i++) {
    let x, z;
    if (centers) { const ct = centers[Math.floor(rnd() * centers.length)]; x = ct[0] + (rnd() - .5) * .5; z = ct[1] + (rnd() - .5) * .5; }
    else { x = (rnd() - .5) * TILE; z = (rnd() - .5) * TILE; }
    const h = hMin + Math.pow(rnd(), 1.3) * (hMax - hMin);
    e.set((rnd() - .5) * (centers ? .7 : .9), rnd() * Math.PI * 2, (rnd() - .5) * (centers ? .7 : .9)); q.setFromEuler(e);
    s.set(.6 + rnd() * .9, h, 1); p.set(x, 0, z); m.compose(p, q, s); mesh.setMatrixAt(i, m);
    const pc = palette[Math.floor(rnd() * palette.length)]; c.setRGB(pc[0], pc[1], pc[2]).multiplyScalar(.75 + rnd() * .4); mesh.setColorAt(i, c);
